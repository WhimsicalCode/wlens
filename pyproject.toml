[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wlens"
version = "0.4.0"
description = "Warehouse lens for AI agents — per-table markdown docs + read-only SQL adaptor, zero-runtime schema exploration for Claude Code, Cursor, Continue."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Whimsical" }]
keywords = ["dbt", "llm", "agent", "warehouse", "schema", "ai", "redshift", "postgres", "claude-code", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "psycopg2-binary>=2.9",
    "duckdb>=1.0",
    "mcp>=1.27.0",
    "starlette>=0.27",
    "anyio>=4.5",
    "uvicorn[standard]>=0.46.0",
    "pyngrok>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
wlens = "wlens.cli:main"

[project.urls]
Homepage = "https://github.com/WhimsicalCode/wlens"
Repository = "https://github.com/WhimsicalCode/wlens"
Issues = "https://github.com/WhimsicalCode/wlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
